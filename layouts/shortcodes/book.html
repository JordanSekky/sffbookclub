<div class="not-prose flex flex-col md:flex-row gap-6 items-start">
  <div class="shrink-0 w-full md:w-auto flex justify-center md:block">
      <img src="{{ .Get "src" | relURL }}" alt="{{ .Get "alt" }}" class="{{ .Get "height" | default "h-48" }} {{ .Get "class" }} w-auto object-cover rounded shadow-lg hover:shadow-xl transition-shadow duration-300">
    </div>
  <div class="flex flex-col w-full">
    {{ if .Get "date" }}
    <h3 class="text-xl font-bold text-gray-900 mb-2 uppercase tracking-wide">{{ .Get "date" }}</h3>
    {{ end }}
    
    {{ if .Get "title" }}
    <h2 class="text-2xl font-bold mb-1 leading-tight">
      {{ .Get "title" }}
    </h2>
    {{ end }}
    
    {{ if .Get "author" }}
    <p class="text-gray-300 text-lg mb-4">by {{ .Get "author" }}</p>
    {{ end }}

    <div class="flex flex-wrap gap-3 mt-auto">
      {{ if .Get "book_link" }}
      <a href="{{ .Get "book_link" }}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 no-underline">
        Order Book
      </a>
      {{ end }}
      
      {{ if .Get "ebook_link" }}
      <a href="{{ .Get "ebook_link" }}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 no-underline">
        Ebook
      </a>
      {{ end }}

      {{ if .Get "audio_link" }}
      <a href="{{ .Get "audio_link" }}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 no-underline">
        Audiobook
      </a>
      {{ end }}
    </div>
  </div>
</div>
